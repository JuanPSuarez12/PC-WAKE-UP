<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PC Gaming - Control</title

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .status-box {
      background: rgba(2, 6, 23, 0.8);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .status-row:last-child {
      border-bottom: none;
    }

    .status-name {
      font-size: 15px;
      color: #cbd5e1;
    }

    .status {
      font-weight: bold;
      font-size: 14px;
    }

    .online {
      color: #22c55e;
    }

    .offline {
      color: #ef4444;
    }

    .unknown {
      color: #f59e0b;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 17px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    #wakeButton {
      background: #22c55e;
      color: white;
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.25);
    }

    #wakeButton:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #16a34a;
    }

    #wakeButton:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    .settings {
      margin-top: 12px;
      background: #334155;
      color: white;
    }

    .settings:hover {
      background: #475569;
    }

    #message {
      text-align: center;
      min-height: 22px;
      margin-top: 18px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .connection {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #94a3b8;
    }

    .last-update {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 11px;
      color: #475569;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>🎮 PC Gaming</h1>

    <div class="subtitle">
      Control remoto
    </div>

    <!-- ESTADOS -->
    <div class="status-box">

      <div class="status-row">
        <span class="status-name">🖥️ PC</span>
        <span id="pcStatus" class="status unknown">
          SIN DATOS
        </span>
      </div>

      <div class="status-row">
        <span class="status-name">🌐 Tailscale</span>
        <span id="tailscaleStatus" class="status unknown">
          SIN DATOS
        </span>
      </div>

      <div class="status-row">
        <span class="status-name">🎮 Sunshine</span>
        <span id="sunshineStatus" class="status unknown">
          SIN DATOS
        </span>
      </div>

    </div>


    <!-- BOTÓN WAKE -->
    <button
      id="wakeButton"
      onclick="wakePC()"
      disabled
    >
      ⚡ ENCENDER PC
    </button>


    <!-- CONFIGURACIÓN -->
    <button
      class="settings"
      onclick="configureMQTT()"
    >
      ⚙️ Configurar conexión
    </button>


    <div id="message">
      Conectando...
    </div>


    <div class="connection">
      MQTT:
      <span id="connection">
        Desconectado
      </span>
    </div>


    <div class="last-update">
      Última actualización:
      <span id="lastUpdate">
        Nunca
      </span>
    </div>


    <div class="footer">
      PC Gaming Remote Control
    </div>

  </div>

</div>


<script>

  /* =========================================
     CONFIGURACIÓN MQTT
  ========================================= */

  const MQTT_HOST =
    "wss://a50a4a68b1a247a1866a3db9a6d40ce2.s1.eu.hivemq.cloud:8884/mqtt";

  const MQTT_USER = "JuanxSt12";

  const MQTT_WAKE_TOPIC =
    "juanpablo/pc/wake";

  const MQTT_STATUS_TOPIC =
    "juanpablo/pc/status";


  let mqttClient = null;

  let lastStatusTime = 0;

  let statusTimeout = null;


  /* =========================================
     ELEMENTOS HTML
  ========================================= */

  const wakeButton =
    document.getElementById("wakeButton");

  const message =
    document.getElementById("message");

  const connection =
    document.getElementById("connection");

  const pcStatus =
    document.getElementById("pcStatus");

  const tailscaleStatus =
    document.getElementById("tailscaleStatus");

  const sunshineStatus =
    document.getElementById("sunshineStatus");

  const lastUpdate =
    document.getElementById("lastUpdate");


  /* =========================================
     CONFIGURAR MQTT
  ========================================= */

  function configureMQTT() {

    const password = prompt(
      "Introduce la contraseña de tu credencial HiveMQ:"
    );

    if (!password) {
      return;
    }

    localStorage.setItem(
      "mqtt_password",
      password
    );

    message.textContent =
      "Contraseña guardada. Conectando...";

    connectMQTT();
  }


  /* =========================================
     CONECTAR MQTT
  ========================================= */

  function connectMQTT() {

    const password =
      localStorage.getItem("mqtt_password");


    if (!password) {

      connection.textContent =
        "Sin configurar";

      message.textContent =
        "Configura primero la conexión MQTT";

      wakeButton.disabled = true;

      return;
    }


    if (mqttClient) {

      try {
        mqttClient.end(true);
      } catch (e) {}

    }


    connection.textContent =
      "Conectando...";

    connection.style.color =
      "#f59e0b";


    mqttClient = mqtt.connect(
      MQTT_HOST,
      {

        username: MQTT_USER,

        password: password,

        clean: true,

        reconnectPeriod: 5000,

        connectTimeout: 10000,

        protocolVersion: 4

      }
    );


    /* =====================================
       MQTT CONECTADO
    ===================================== */

    mqttClient.on("connect", function () {

      console.log("MQTT conectado");

      connection.textContent =
        "Conectado";

      connection.style.color =
        "#22c55e";


      message.textContent =
        "Conectado a HiveMQ";


      /*
        IMPORTANTE:

        El botón se habilita apenas MQTT
        está conectado.

        NO depende del estado del PC.
      */

      wakeButton.disabled = false;

      wakeButton.textContent =
        "⚡ ENCENDER PC";


      /* SUSCRIBIRSE AL ESTADO */

      mqttClient.subscribe(
        MQTT_STATUS_TOPIC,
        {
          qos: 1
        },
        function (error) {

          if (error) {

            console.error(
              "Error suscripción:",
              error
            );

            message.textContent =
              "MQTT conectado, pero no se pudo recibir estado";

          } else {

            console.log(
              "Suscrito a:",
              MQTT_STATUS_TOPIC
            );

          }

        }
      );

    });


    /* =====================================
       RECIBIR MENSAJES
    ===================================== */

    mqttClient.on("message", function (
      topic,
      payload
    ) {

      console.log(
        "Mensaje recibido:",
        topic,
        payload.toString()
      );


      if (
        topic !== MQTT_STATUS_TOPIC
      ) {
        return;
      }


      try {

        const data =
          JSON.parse(payload.toString());


        updateStatus(data);

      } catch (error) {

        console.error(
          "JSON inválido:",
          error
        );

      }

    });


    /* =====================================
       DESCONEXIÓN
    ===================================== */

    mqttClient.on("close", function () {

      connection.textContent =
        "Desconectado";

      connection.style.color =
        "#ef4444";

      message.textContent =
        "MQTT desconectado. Reintentando...";

    });


    /* =====================================
       ERROR
    ===================================== */

    mqttClient.on("error", function (error) {

      console.error(
        "MQTT ERROR:",
        error
      );

      connection.textContent =
        "Error";

      connection.style.color =
        "#ef4444";

      message.textContent =
        "Error de conexión MQTT";

    });

  }


  /* =========================================
     ACTUALIZAR ESTADOS
  ========================================= */

  function updateStatus(data) {

    console.log(
      "Estado del PC:",
      data
    );


    lastStatusTime = Date.now();


    /* PC */

    setStatus(
      pcStatus,
      data.pc
    );


    /* TAILSCALE */

    setStatus(
      tailscaleStatus,
      data.tailscale
    );


    /* SUNSHINE */

    setStatus(
      sunshineStatus,
      data.sunshine
    );


    /* HORA */

    const now =
      new Date();

    lastUpdate.textContent =
      now.toLocaleTimeString();


    message.textContent =
      "Estado actualizado";


    /*
      Si recibimos heartbeat,
      reiniciamos temporizador.
    */

    if (statusTimeout) {
      clearTimeout(statusTimeout);
    }


    statusTimeout =
      setTimeout(
        statusLost,
        90000
      );

  }


  /* =========================================
     MOSTRAR ESTADO INDIVIDUAL
  ========================================= */

  function setStatus(
    element,
    value
  ) {

    element.classList.remove(
      "online",
      "offline",
      "unknown"
    );


    if (
      value === "online"
    ) {

      element.textContent =
        "🟢 ONLINE";

      element.classList.add(
        "online"
      );

    }

    else if (
      value === "offline"
    ) {

      element.textContent =
        "🔴 OFFLINE";

      element.classList.add(
        "offline"
      );

    }

    else {

      element.textContent =
        "🟡 SIN DATOS";

      element.classList.add(
        "unknown"
      );

    }

  }


  /* =========================================
     SE PERDIÓ EL HEARTBEAT
  ========================================= */

  function statusLost() {

    setStatus(
      pcStatus,
      "offline"
    );

    setStatus(
      tailscaleStatus,
      "offline"
    );

    setStatus(
      sunshineStatus,
      "offline"
    );


    message.textContent =
      "No se recibe señal del PC";

    lastUpdate.textContent =
      "Sin señal";

  }


  /* =========================================
     ENCENDER PC
  ========================================= */

  function wakePC() {

    if (
      !mqttClient ||
      !mqttClient.connected
    ) {

      message.textContent =
        "MQTT no está conectado";

      return;

    }


    wakeButton.disabled = true;

    wakeButton.textContent =
      "⚡ ENVIANDO...";


    mqttClient.publish(
      MQTT_WAKE_TOPIC,
      "WAKE",
      {
        qos: 1,
        retain: false
      },
      function (error) {

        if (error) {

          console.error(
            "Error enviando WAKE:",
            error
          );

          message.textContent =
            "❌ Error enviando comando";

          wakeButton.disabled =
            false;

          wakeButton.textContent =
            "⚡ ENCENDER PC";

          return;

        }


        console.log(
          "WAKE enviado"
        );


        message.textContent =
          "⚡ Comando enviado al ESP32";


        wakeButton.textContent =
          "⚡ PC ENCENDIÉNDOSE...";


        /*
          Después de 15 segundos
          volvemos a permitir pulsar.
        */

        setTimeout(
          function () {

            wakeButton.disabled =
              false;

            wakeButton.textContent =
              "⚡ ENCENDER PC";

          },
          15000
        );

      }
    );

  }


  /* =========================================
     INICIO
  ========================================= */

  window.addEventListener(
    "load",
    function () {

      const savedPassword =
        localStorage.getItem(
          "mqtt_password"
        );


      if (savedPassword) {

        message.textContent =
          "Contraseña encontrada. Conectando...";

        connectMQTT();

      } else {

        message.textContent =
          "Configura tu conexión MQTT";

        connection.textContent =
          "Sin configurar";

      }

    }
  );

</script>

</body>
</html>
