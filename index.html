<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PC Gaming - Wake-on-LAN</title>

    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #202020,
                    #080808
                );

            color: white;
        }

        .container {

            width: 90%;
            max-width: 420px;

            background: #181818;

            padding: 30px;

            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.5);
        }

        .icon {

            font-size: 55px;

            margin-bottom: 10px;
        }

        h1 {

            margin: 0;

            font-size: 28px;
        }

        .subtitle {

            color: #999;

            margin-top: 8px;
        }

        .connection {

            margin: 25px 0;

            padding: 12px;

            border-radius: 12px;

            background: #252525;

            font-size: 14px;
        }

        .dot {

            display: inline-block;

            width: 10px;
            height: 10px;

            border-radius: 50%;

            margin-right: 7px;

            background: #777;
        }

        .connected {

            background: #00c853;
        }

        .disconnected {

            background: #f44336;
        }

        button {

            width: 100%;

            padding: 20px;

            border: none;

            border-radius: 15px;

            background: #00c853;

            color: white;

            font-size: 21px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.15s;
        }

        button:hover {

            background: #00b34a;
        }

        button:active {

            transform: scale(0.96);
        }

        button:disabled {

            background: #555;

            cursor: not-allowed;

            transform: none;
        }

        #status {

            min-height: 24px;

            margin-top: 22px;

            color: #aaa;

            font-size: 15px;
        }

        .info {

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #333;

            color: #777;

            font-size: 13px;

            line-height: 1.6;
        }

        .settings {

            margin-top: 20px;
        }

        .settings button {

            background: #333;

            font-size: 14px;

            padding: 10px;
        }

        .settings button:hover {

            background: #444;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="icon">
        🖥️
    </div>

    <h1>PC Gaming</h1>

    <div class="subtitle">
        Wake-on-LAN remoto
    </div>


    <!-- ESTADO MQTT -->

    <div class="connection">

        <span id="dot" class="dot disconnected"></span>

        <span id="connectionText">
            Conectando a HiveMQ...
        </span>

    </div>


    <!-- BOTÓN -->

    <button
        id="wakeButton"
        onclick="wakePC()"
        disabled
    >

        ⚡ ENCENDER PC

    </button>


    <!-- ESTADO -->

    <div id="status">

        Conectando...

    </div>


    <!-- INFORMACIÓN -->

    <div class="info">

        ESP32 Wake-on-LAN<br>

        MAC PC:<br>

        34:5A:60:D9:80:2E

    </div>


    <!-- CONFIGURACIÓN -->

    <div class="settings">

        <button onclick="configureMQTT()">

            ⚙️ Configurar conexión

        </button>

    </div>

</div>


<script>


// =====================================================
// CONFIGURACIÓN HIVEMQ
// =====================================================

// Servidor WebSocket seguro de HiveMQ
const MQTT_HOST =
    "wss://a50a4a68b1a247a1866a3db9a6d40ce2.s1.eu.hivemq.cloud:8884/mqtt";


// Topic que escucha la ESP32
const MQTT_TOPIC =
    "juanpablo/pc/wake";


// Usuario HiveMQ
const MQTT_USER =
    "JuanxSt12";


// =====================================================
// VARIABLES
// =====================================================

let mqttClient = null;


// =====================================================
// ELEMENTOS HTML
// =====================================================

const wakeButton =
    document.getElementById("wakeButton");

const statusText =
    document.getElementById("status");

const connectionText =
    document.getElementById("connectionText");

const dot =
    document.getElementById("dot");


// =====================================================
// CLIENT ID
// =====================================================

function generateClientID() {

    return "WEB-WOL-" +
        Math.random()
        .toString(16)
        .substring(2);
}


// =====================================================
// CONFIGURAR CREDENCIALES
// =====================================================

function configureMQTT() {

    const password =
        prompt(
            "Introduce la contraseña de tu credencial HiveMQ:"
        );

    if (!password) {

        return;
    }

    // Guardar solamente en este navegador
    localStorage.setItem(
        "mqtt_password",
        password
    );

    statusText.innerText =
        "Contraseña guardada. Conectando...";

    connectMQTT();
}


// =====================================================
// CONECTAR A HIVEMQ
// =====================================================

function connectMQTT() {

    const password =
        localStorage.getItem(
            "mqtt_password"
        );


    // -------------------------------------------------
    // Si todavía no existe contraseña
    // -------------------------------------------------

    if (!password) {

        connectionText.innerText =
            "Falta configurar contraseña";

        statusText.innerText =
            "Pulsa ⚙️ Configurar conexión.";

        return;
    }


    // -------------------------------------------------
    // Evitar conexiones duplicadas
    // -------------------------------------------------

    if (
        mqttClient &&
        mqttClient.connected
    ) {

        return;
    }


    connectionText.innerText =
        "Conectando a HiveMQ...";

    dot.className =
        "dot";


    // -------------------------------------------------
    // MQTT
    // -------------------------------------------------

    mqttClient = mqtt.connect(
        MQTT_HOST,
        {

            clientId:
                generateClientID(),

            username:
                MQTT_USER,

            password:
                password,

            clean:
                true,

            connectTimeout:
                10000,

            reconnectPeriod:
                5000,

            protocolVersion:
                4

        }
    );


    // =================================================
    // CONECTADO
    // =================================================

    mqttClient.on(
        "connect",
        function() {

            console.log(
                "MQTT conectado"
            );


            connectionText.innerText =
                "HiveMQ conectado";

            dot.className =
                "dot connected";


            wakeButton.disabled =
                false;


            statusText.innerText =
                "Listo para encender el PC.";

        }
    );


    // =================================================
    // ERROR
    // =================================================

    mqttClient.on(
        "error",
        function(error) {

            console.error(
                "MQTT ERROR:",
                error
            );


            connectionText.innerText =
                "Error MQTT";

            dot.className =
                "dot disconnected";


            wakeButton.disabled =
                true;


            statusText.innerText =
                "No se pudo conectar a HiveMQ.";

        }
    );


    // =================================================
    // DESCONECTADO
    // =================================================

    mqttClient.on(
        "close",
        function() {

            connectionText.innerText =
                "HiveMQ desconectado";

            dot.className =
                "dot disconnected";


            wakeButton.disabled =
                true;


            statusText.innerText =
                "Intentando reconectar...";

        }
    );

}


// =====================================================
// ENCENDER PC
// =====================================================

function wakePC() {

    // -------------------------------------------------
    // Comprobar conexión
    // -------------------------------------------------

    if (
        !mqttClient ||
        !mqttClient.connected
    ) {

        statusText.innerText =
            "❌ MQTT no está conectado.";

        return;
    }


    // -------------------------------------------------
    // Desactivar botón
    // -------------------------------------------------

    wakeButton.disabled =
        true;


    statusText.innerText =
        "⚡ Enviando comando WAKE...";


    // -------------------------------------------------
    // PUBLICAR
    // -------------------------------------------------

    mqttClient.publish(

        MQTT_TOPIC,

        "WAKE",

        {
            qos: 1,
            retain: false
        },

        function(error) {

            if (error) {

                console.error(
                    error
                );


                statusText.innerText =
                    "❌ Error enviando WAKE.";

            }

            else {

                statusText.innerText =
                    "⚡ Magic Packet solicitado.";

            }


            // Volver a habilitar botón

            setTimeout(
                function() {

                    wakeButton.disabled =
                        false;

                },
                2000
            );

        }

    );

}


// =====================================================
// INICIAR
// =====================================================

window.addEventListener(
    "load",
    function() {

        connectMQTT();

    }
);


</script>


</body>

</html>
