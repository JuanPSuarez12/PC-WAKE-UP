<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PC Gaming - Control</title>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #181b21;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 25px;
        }

        .status-card {
            background: #111318;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #272b33;
        }

        .status-row:last-child {
            border-bottom: none;
        }

        .status-label {
            font-size: 15px;
        }

        .status-value {
            font-weight: bold;
        }

        .online {
            color: #35d07f;
        }

        .offline {
            color: #ff4d4d;
        }

        .warning {
            color: #ffb84d;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 17px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: #ffffff;
            color: #111;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            min-height: 24px;
            color: #aaa;
        }

        .last-update {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: #777;
        }

        .connection {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎮 PC GAMING</h1>
    <div class="subtitle">Control remoto</div>

    <div class="status-card">

        <div class="status-row">
            <span class="status-label">🖥️ PC</span>
            <span id="pcStatus" class="status-value offline">
                🔴 SIN SEÑAL
            </span>
        </div>

        <div class="status-row">
            <span class="status-label">🌐 Tailscale</span>
            <span id="tailscaleStatus" class="status-value offline">
                🔴 DESCONECTADO
            </span>
        </div>

        <div class="status-row">
            <span class="status-label">🎮 Sunshine</span>
            <span id="sunshineStatus" class="status-value offline">
                🔴 DETENIDO
            </span>
        </div>

    </div>

    <button id="wakeButton" onclick="wakePC()" disabled>
        ⚡ ENCENDER PC
    </button>

    <div id="message" class="message">
        Conectando...
    </div>

    <div id="lastUpdate" class="last-update">
        Sin datos
    </div>

    <div id="connection" class="connection">
        HiveMQ: conectando...
    </div>

</div>

<script>

    // =========================================
    // CONFIGURACIÓN HIVEMQ
    // =========================================

    const MQTT_HOST = "a50a4a68b1a247a1866a3db9a6d40ce2.s1.eu.hivemq.cloud";

const MQTT_USER = "web-panel";
    const MQTT_PASS = "1022959201aa.";

    const WAKE_TOPIC = "juanpablo/pc/wake";
    const STATUS_TOPIC = "juanpablo/pc/status";

    // HiveMQ Cloud usa Secure WebSockets en 8884
    const MQTT_URL = `wss://${MQTT_HOST}:8884/mqtt`;

    // =========================================
    // VARIABLES
    // =========================================

    let lastStatusTime = 0;

    const client = mqtt.connect(MQTT_URL, {
        username: MQTT_USER,
        password: MQTT_PASS,
        clientId: "web_" + Math.random().toString(16).substring(2, 10),

        clean: true,
        reconnectPeriod: 3000,
        connectTimeout: 10000,
        keepalive: 30
    });

    // =========================================
    // CONEXIÓN
    // =========================================

    client.on("connect", function () {

        document.getElementById("connection").textContent =
            "HiveMQ: 🟢 conectado";

        document.getElementById("connection").className = "connection online";

        document.getElementById("wakeButton").disabled = false;

        client.subscribe(STATUS_TOPIC, function (err) {

            if (err) {
                console.error("Error al suscribirse:", err);
                return;
            }

            console.log("Suscrito a", STATUS_TOPIC);
        });
    });

    // =========================================
    // RECIBIR ESTADO DEL PC
    // =========================================

    client.on("message", function (topic, payload) {

        if (topic !== STATUS_TOPIC) {
            return;
        }

        try {

            const data = JSON.parse(payload.toString());

            console.log("Estado recibido:", data);

            lastStatusTime = Date.now();

            // PC
            if (data.pc === "online") {

                setStatus(
                    "pcStatus",
                    "🟢 ENCENDIDO",
                    "online"
                );

            } else {

                setStatus(
                    "pcStatus",
                    "🔴 APAGADO",
                    "offline"
                );
            }

            // Tailscale
            if (data.tailscale === "online") {

                setStatus(
                    "tailscaleStatus",
                    "🟢 CONECTADO",
                    "online"
                );

            } else {

                setStatus(
                    "tailscaleStatus",
                    "🔴 DESCONECTADO",
                    "offline"
                );
            }

            // Sunshine
            if (data.sunshine === "online") {

                setStatus(
                    "sunshineStatus",
                    "🟢 DISPONIBLE",
                    "online"
                );

            } else {

                setStatus(
                    "sunshineStatus",
                    "🔴 DETENIDO",
                    "offline"
                );
            }

            document.getElementById("lastUpdate").textContent =
                "Última señal: hace unos segundos";

        } catch (error) {

            console.error(
                "Error interpretando estado:",
                error
            );
        }
    });

    // =========================================
    // CONTROL DE ESTADOS
    // =========================================

    function setStatus(id, text, type) {

        const element = document.getElementById(id);

        element.textContent = text;

        element.className =
            "status-value " + type;
    }

    // =========================================
    // ENCENDER PC
    // =========================================

    function wakePC() {

        if (!client.connected) {

            document.getElementById("message").textContent =
                "❌ HiveMQ no está conectado";

            return;
        }

        client.publish(
            WAKE_TOPIC,
            "WAKE",
            {
                qos: 0,
                retain: false
            },
            function (error) {

                if (error) {

                    document.getElementById("message").textContent =
                        "❌ Error enviando comando";

                    console.error(error);

                } else {

                    document.getElementById("message").textContent =
                        "⚡ Comando enviado. Encendiendo PC...";

                    setStatus(
                        "pcStatus",
                        "🟡 ENCENDIENDO",
                        "warning"
                    );
                }
            }
        );
    }

    // =========================================
    // ERRORES MQTT
    // =========================================

    client.on("error", function (error) {

        console.error("MQTT Error:", error);

        document.getElementById("connection").textContent =
            "HiveMQ: 🔴 error de conexión";

        document.getElementById("connection").className =
            "connection offline";
    });

    client.on("reconnect", function () {

        document.getElementById("connection").textContent =
            "HiveMQ: 🟡 reconectando...";

        document.getElementById("connection").className =
            "connection warning";

        document.getElementById("wakeButton").disabled = true;
    });

    client.on("close", function () {

        document.getElementById("connection").textContent =
            "HiveMQ: 🔴 desconectado";

        document.getElementById("connection").className =
            "connection offline";

        document.getElementById("wakeButton").disabled = true;
    });

    // =========================================
    // SI NO LLEGA HEARTBEAT
    // =========================================

    setInterval(function () {

        if (lastStatusTime === 0) {
            return;
        }

        const seconds =
            Math.floor(
                (Date.now() - lastStatusTime) / 1000
            );

        document.getElementById("lastUpdate").textContent =
            "Última señal: hace " + seconds + " segundos";

        // 90 segundos sin heartbeat
        if (seconds > 90) {

            setStatus(
                "pcStatus",
                "🔴 SIN SEÑAL",
                "offline"
            );

            setStatus(
                "tailscaleStatus",
                "⚫ SIN DATOS",
                "offline"
            );

            setStatus(
                "sunshineStatus",
                "⚫ SIN DATOS",
                "offline"
            );
        }

    }, 1000);

</script>

</body>
</html>
